[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-validator"
version = "0.8.0"
description = "Validate network topologies for security design flaws. PBQ-style simulator included."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ayush Singh" }
]
keywords = ["network", "security", "topology", "validator", "pbq", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "bandit[toml]>=1.7", "pip-audit>=2.6"]

[project.scripts]
topology-validator = "topology_validator.cli:main"

[project.urls]
Homepage = "https://github.com/ayus1n9/topology-validator"
Source = "https://github.com/ayus1n9/topology-validator"
Issues = "https://github.com/ayus1n9/topology-validator/issues"
Changelog = "https://github.com/ayus1n9/topology-validator/releases"

[tool.setuptools]
packages = ["topology_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]  # B101 = assert_used (fine in our context)